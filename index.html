<script>
"use strict";
/* ===== MiniPDF : vrai fichier PDF fabriqué sur l'appareil, sans bibliothèque (Helvetica, A4) ===== */
const MiniPDF = (()=>{
  const CP = {"€":128,"‚":130,"ƒ":131,"„":132,"…":133,"†":134,"‡":135,"ˆ":136,"‰":137,"Š":138,"‹":139,"Œ":140,"Ž":142,"‘":145,"’":146,"“":147,"”":148,"•":149,"–":150,"—":151,"˜":152,"™":153,"š":154,"›":155,"œ":156,"ž":158,"Ÿ":159};
  const SUB = {"→":"->","←":"<-","≤":"<=","≥":">=","✓":"OK","★":"*","ⓘ":"i","✎":""," ":" "," ":" ","‑":"-","≈":"~","×":"×","…":"…","Δ":"D","°":"°"};
  function enc(s){ let o=""; for(const ch of String(s??"")){ let c=ch; if(c.charCodeAt(0)>255 && !(c in CP) && SUB[c]!=null) c=SUB[c]; for(const k of c){ const n=k.charCodeAt(0); if(n<256) o+=k; else if(CP[k]) o+=String.fromCharCode(CP[k]); else o+="?"; } } return o.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)"); }
  let ctx=null;
  function width(s,size,bold){ if(!ctx){ ctx=document.createElement("canvas").getContext("2d"); } ctx.font=(bold?"bold ":"")+"100px Helvetica, Arial, sans-serif"; return ctx.measureText(String(s)).width/100*size*1.02; }
  function hex(c){ const m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(c||"#000000"); return m?[1,2,3].map(i=>(parseInt(m[i],16)/255).toFixed(3)).join(" "):"0 0 0"; }
  class Doc{
    constructor(opt={}){ this.W=opt.landscape?842:595; this.H=opt.landscape?595:842; this.M=opt.margin||36; this.pages=[]; this.addPage(); }
    addPage(){ this.cur=[]; this.pages.push(this.cur); this.y=this.M; return this; }
    text(x,y,s,o={}){ const sz=o.size||10; this.cur.push(`BT /${o.bold?"F2":"F1"} ${sz} Tf ${hex(o.color)} rg ${x.toFixed(2)} ${(this.H-y-sz*0.8).toFixed(2)} Td (${enc(s)}) Tj ET`); }
    rect(x,y,w,h,o={}){ const c=[]; if(o.fill) c.push(hex(o.fill)+" rg"); if(o.stroke) c.push(hex(o.stroke)+" RG "+(o.lw||0.6)+" w"); c.push(`${x.toFixed(2)} ${(this.H-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re ${o.fill&&o.stroke?"B":o.fill?"f":"S"}`); this.cur.push(c.join(" ")); }
    line(x1,y1,x2,y2,o={}){ this.cur.push(`${hex(o.color||"#C8CDD4")} RG ${o.lw||0.6} w ${x1.toFixed(2)} ${(this.H-y1).toFixed(2)} m ${x2.toFixed(2)} ${(this.H-y2).toFixed(2)} l S`); }
    wrap(s,size,maxw,bold){ const out=[]; for(const para of String(s??"").split("\n")){ let line=""; for(const w of para.split(/\s+/)){ if(!w) continue; const t=line?line+" "+w:w; if(width(t,size,bold)<=maxw||!line) line=t; else { out.push(line); line=w; } } out.push(line); } return out; }
    need(h){ if(this.y+h>this.H-this.M) { this.addPage(); return true; } return false; }
    /* paragraphe avec retour à la ligne et saut de page automatique */
    para(s,o={}){ const sz=o.size||10, lh=sz*(o.lh||1.3), x=o.x??this.M, w=o.w??(this.W-this.M-x); for(const l of this.wrap(s,sz,w,o.bold)){ this.need(lh); this.text(x,this.y,l,o); this.y+=lh; } this.y+=o.after??2; }
    out(){
      const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
      add("<< /Type /Catalog /Pages 2 0 R >>"); add("PAGES");
      add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
      add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
      const kids=[];
      for(const p of this.pages){ const st=p.join("\n"); const c=add(`<< /Length ${st.length} >>\nstream\n${st}\nendstream`); kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${c} 0 R >>`)); }
      objs[1]=`<< /Type /Pages /Kids [${kids.map(k=>k+" 0 R").join(" ")}] /Count ${kids.length} >>`;
      let s="%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"; const off=[];
      objs.forEach((o,i)=>{ off.push(s.length); s+=`${i+1} 0 obj\n${o}\nendobj\n`; });
      const x=s.length; s+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
      const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i)&255; return new Blob([b],{type:"application/pdf"});
    }
  }
  /* remise du fichier : feuille de partage (Imprimer, Enregistrer dans Fichiers…) sinon téléchargement */
  async function deliver(blob,name){
    const file=new File([blob],name,{type:"application/pdf"});
    try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return "share"; } }catch(e){ if(e && e.name==="AbortError") return "abort"; }
    const u=URL.createObjectURL(blob), a=document.createElement("a"); a.href=u; a.download=name; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
    return "download";
  }
  return {Doc, deliver, width};
})();

/* ===== APPLI 3 : CRÉATION DE SÉANCES (structure automatique, exos choisis par l'entraîneur) ===== */
const SK="seances_v1", JK="grilles_joueurs_v1", PK="programmation_v1", CK="programmation_cache_v1";
let DATA=null, EX={}, FAM={};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const todayIso=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const frD=s=>s?s.split("-").reverse().join("/"):"";
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function load(k,def){ try{ return JSON.parse(localStorage.getItem(k))||def; }catch(e){ return def; } }
let ST=load(SK,{seances:[],mat:null,lieu:"court"}); if(!Array.isArray(ST.seances)) ST.seances=[];
function saveNow(){ try{ localStorage.setItem(SK,JSON.stringify(ST)); }catch(e){} }
let svT=null; function save(){ clearTimeout(svT); svT=setTimeout(saveNow,150); }
const joueurs=()=>{ const j=load(JK,{joueurs:[]}); return Array.isArray(j.joueurs)?j.joueurs:[]; };
const profils=()=>load(PK,{profils:{}}).profils||{};
const getS=id=>ST.seances.find(s=>s.id===id);
const main=$("#main");

/* ---------- référentiels ---------- */
const TYPES={PPI:{n:"PP individuelle",c:"pp"},PPC:{n:"PP collective",c:"pp"},TI:{n:"Tennis individuel (biomécanique)",c:"tb"},TC:{n:"Tennis collectif",c:"ten"},PM:{n:"Préparation mentale",c:"pm"}};
const PHASES={R0:"Reprise",G:"Préparation générale",S:"Préparation spécifique",P:"Affûtage",C:"Compétition",R:"Récupération"};
const LIEUX={court:"Court de tennis",gym:"Gymnase",salle:"Salle de PP",ext:"Extérieur"};
const LN={PP:["Force du bas du corps","Force du haut du corps","Gainage et stabilité du tronc","Puissance des jambes : sauts et pliométrie","Puissance du haut du corps et rotation","Vitesse et accélération","Freinage, changements de direction et agilité","Endurance aérobie","Répétition d'efforts intenses","Coordination, motricité fondamentale et rythme","Équilibre et proprioception","Mobilité et souplesse"],
 GE:["Service à plat","Service slicé","Service lifté","Coup droit lifté","Coup droit à plat","Coup droit slicé","Revers lifté","Revers à plat","Revers slicé","Volée de coup droit","Volée de revers","Smash","Amortie et touché de balle"],
 DE:["Position d'attention","Allègement et reprise d'appuis","Démarrage et premiers pas","Déplacements latéraux","Déplacements vers l'avant et vers l'arrière","Pas d'ajustement et mise à distance","Appuis de frappe","Freinage et décélération","Changement de direction et réaccélération","Replacement","Enchaînements et liaison des actions"]};
const lineName=l=>{const m=/^(PP|GE|DE)(\d+)$/.exec(l);return m?LN[m[1]][+m[2]-1]:l;};
const chip=l=>`<span class="lc ${l.slice(0,2).toLowerCase()}" title="${esc(lineName(l))}">${l}</span>`;
const CLASSEMENTS=["NC","40","30/5","30/4","30/3","30/2","30/1","30","15/5","15/4","15/3","15/2","15/1","15","5/6","4/6","3/6","2/6","1/6","0","-2/6","-4/6","-15","-30","Top 60","Top 40"];
function seuils(a){ return a<=10?[2,6,9]:a<=12?[5,10,13]:a<=14?[8,13,16]:a<=16?[11,15,19]:[13,17,21]; }
function niveauDe(cl,a){ const i=CLASSEMENTS.indexOf(cl); if(i<0) return 0; const s=seuils(a); return i>=s[2]?3:i>=s[1]?2:i>=s[0]?1:0; }
const NIVN=["Départemental","Régional","National","International"];
function ageAt(nai){ if(!nai) return null; const a=new Date(nai),r=new Date(); let y=r.getFullYear()-a.getFullYear(); if(r.getMonth()<a.getMonth()||(r.getMonth()===a.getMonth()&&r.getDate()<a.getDate())) y--; return y; }
const ZR={dos:/charni|charge|chargee|lest|medecine|lancer|rotation|extension|cambr/,genou:/saut|bond|pliom|reception|fente|squat|freinage|contrebas|profondeur/,talon:/saut|bond|pliom|sautill|corde|sprint|reception/,epaule:/lancer|medecine|developpe|tirage|traction|suspension|au-dessus de la tete|pompe/,poignet:/appui sur les mains|pompe|medecine|lancer|quadrup|planche/,hanche:/fente|ecart|charni|grand pas/};
const ZPREV={dos:/rachis|dos|lomb|bassin/,genou:/genou/,talon:/pied|cheville|tendon|mollet/,epaule:/epaule|coiffe|omoplate/,poignet:/poignet|coude/,hanche:/hanche/};
const ZN={dos:"Dos",genou:"Genou",talon:"Talon",epaule:"Épaule",poignet:"Poignet",hanche:"Hanche"};

/* ---------- contexte de la séance ---------- */
function ctxOf(s){
  const J=joueurs(), P=profils(), sel=J.filter(j=>s.joueurs.includes(j.id));
  let age, niv, zones=new Set(), crois=false, faibles=new Set(), n;
  if(sel.length){
    const ages=sel.map(j=>ageAt(j.naissance)).filter(a=>a!=null);
    age=ages.length?Math.min(...ages):(s.libre.age||13);
    niv=Math.max(...sel.map(j=>niveauDe(P[j.id]?.classement||"NC",ageAt(j.naissance)||13)));
    for(const j of sel){ const p=P[j.id]||{}; (p.zones||[]).forEach(z=>zones.add(z)); if(p.croissance) crois=true; (p.prio||[]).forEach(l=>faibles.add(l));
      const b=[...(j.bilans||[])].sort((a,b)=>a.date<b.date?1:-1)[0]; if(b) for(const d of ["PP","GE","DE"]) (b.v?.[d]||[]).forEach((v,i)=>{ if(v&&v<=2) faibles.add(d+(i+1)); }); }
    n=sel.length + (s.libre.extra||0);
  } else { age=s.libre.age||13; niv=+s.libre.niv||0; n=s.libre.n||1; (s.libre.zones||[]).forEach(z=>zones.add(z)); crois=!!s.libre.crois; }
  age=Math.max(4,Math.min(18,age));
  const words=norm(s.theme).split(/[^a-z0-9]+/).filter(w=>w.length>4 && !STOP.has(w));
  return {age,niv,zones:[...zones],crois,faibles:[...faibles],n,mat:new Set(s.mat),lieu:s.lieu,phase:s.phase,words,lignes:s.lignes||[]};
}
const STOP=new Set("avant apres entre puis chaque toujours selon leurs notre votre comme quand votre seance travail sur les des dans avec sans pour plus moins tres bien".split(" "));

/* ---------- classement des exos pour une case ---------- */
function okEx(e,c){
  if(e.a>c.age) return false;
  if(e.c && c.lieu!=="court") return false;
  if(e.e && c.lieu==="salle") return false;
  for(const m of e.m) if(!c.mat.has(m)) return false;
  return true;
}
function scoreEx(e,box,c,used){
  let s=0; const t=norm(e.n+" "+e.s+" "+e.ob);
  const lm=box.L?.length && e.L.some(l=>box.L.includes(l)); if(lm) s+=6;
  if(box.f?.includes(e.f)) s+=3-Math.min(2,box.f.indexOf(e.f)*0.6);
  if(box.kw && box.kw.test(t)) s+=3;
  const tv=c.age<=9?1:c.age<=11?2:c.age<=14?2.5:3.2 + (c.niv>=2?0.4:0);
  s-=Math.abs(e.v-tv)*1.2;
  if(e.a<=c.age-7 && e.v<=1) s-=1.5;
  const fatig=/force|halte|puis|rsa|aero/.test(e.k);
  if((c.phase==="P"||c.phase==="C") && fatig && e.v>=3) s-=1.5;
  if((c.phase==="R0"||c.phase==="R") && e.v>=3) s-=1.5;
  if(box.low && e.v>=3) s-=2;
  if(c.crois && (e.f==="5.1.4"||((e.f==="5.1.8"||e.f==="5.1.9")&&e.v>=3)||/charge|lest|contrebas|profondeur/.test(t))) s-=4;
  const td=norm(e.n+" "+e.de);
  if(!box.prev) for(const z of c.zones) if(ZR[z]?.test(td)) s-=5;
  if(box.prev) for(const z of c.zones) if(ZPREV[z]?.test(norm(e.n+" "+e.s+" "+FAM[e.f]?.t))) s+=4;
  if(c.faibles.length && e.L.some(l=>c.faibles.includes(l))) s+=1.5;
  let w=0; for(const x of c.words) if(t.includes(x)) w++; s+=Math.min(4,w*1.2);
  if(used.has(e.id)) s-=3;
  return s;
}
function pool(box,c,used){
  const out=[];
  for(const e of DATA.ex){
    const inF=box.f?.includes(e.f), inL=box.L?.length && e.L.some(l=>box.L.includes(l));
    if(!inF && !inL) continue;
    if(box.dom && !box.dom.includes(e.dom)) continue;
    if(!okEx(e,c)) continue;
    out.push({e,s:scoreEx(e,box,c,used)});
  }
  return out.sort((a,b)=>b.s-a.s);
}

/* ---------- familles d'une ligne ---------- */
let LFAM={};
function famsOfLine(l){
  if(LFAM[l]) return LFAM[l];
  const c={}; for(const e of DATA.ex) if(e.L.includes(l)) c[e.f]=(c[e.f]||0)+1;
  return LFAM[l]=Object.entries(c).filter(([,n])=>n>=4).map(([f])=>f);
}

/* ---------- modèles de structure ---------- */
function box(nom,part,o){ return {id:uid(),nom,part,min:0,ex:[],at:null,...o}; }
function structure(s){
  const c=ctxOf(s), D=+s.duree||60, T=s.type, tennis=T==="TI"||T==="TC"||T==="PM";
  const L=s.lignes||[], PPL=L.filter(l=>/^(PP|DE)/.test(l)), GEL=L.filter(l=>/^GE/.test(l)), DEL=L.filter(l=>/^DE/.test(l));
  const boxes=[];
  // échauffement : 5 étapes fixes
  const wT=Math.max(10,Math.min(20,Math.round(D*(tennis?0.18:0.22))));
  boxes.push(box("Mise en route","E",{f:["5.2.1","5.2.6"],kw:/trot|marche|course|footing|navette|mise en route|jumping|corde|poursuite/,low:1}));
  boxes.push(box("Mobilité","E",{f:["5.1.21","5.1.22","5.1.23"],low:1}));
  boxes.push(box("Activation et prévention","E",{f:["5.2.2","5.2.3","5.2.4","5.1.5","5.2.9"],prev:1,low:1}));
  boxes.push(box("Gammes et vitesse","E",{f:["5.2.1","5.1.16","5.1.11","5.4.1"],kw:/gamme|montee|talons|pas chasse|skipping|depart|griffe|rythme/,low:1}));
  const specL = tennis ? [...GEL,...DEL] : PPL;
  boxes.push(box("Spécifique au thème","E",tennis?{f:["5.3.7","5.3.14","5.3.15","5.4.1"],L:specL,low:1}:{f:specL.flatMap(famsOfLine),L:specL,low:1}));
  const wb=boxes.filter(b=>b.part==="E"); wb.forEach((b,i)=>b.min=Math.floor(wT/5)+(i<wT%5?1:0));
  // corps de séance
  const nC=D<=40?2:D<=60?3:D<=80?4:5, corps=[];
  if(T==="PPI"||T==="PPC"){
    for(const l of PPL) corps.push(box(lineName(l),"C",{L:[l],f:famsOfLine(l)}));
    const comp=[["PP3"],["prev"],["PP11"],["PP10"],["PP12"]];
    for(const [x] of comp){ if(corps.length>=nC) break; if(x==="prev"){ if(c.zones.length) corps.push(box("Prévention ciblée","C",{f:["5.2.2","5.2.3","5.2.4"],prev:1})); continue; } if(!PPL.includes(x)) corps.push(box(lineName(x),"C",{L:[x],f:famsOfLine(x)})); }
    if(T==="PPC" && corps.length) corps[corps.length-1].at={n:Math.min(4,Math.max(2,Math.ceil((c.n||4)/3)))};
  } else if(T==="TI"){
    const g=GEL[0]||"GE4", d=DEL[0]||"DE7";
    corps.push(box("Éducatif du geste : "+lineName(g),"C",{L:[g],f:famsOfLine(g).filter(f=>f.startsWith("5.3")),dom:["GE"]}));
    corps.push(box("Appuis et déplacement : "+lineName(d),"C",{L:[d],f:["5.4.1","5.4.2"],dom:["DE","GE","PP"]}));
    corps.push(box("Répétition en situation : "+lineName(g),"C",{L:[g],f:["5.3.5","5.3.6","5.3.7","5.3.8","5.5.2"],dom:["GE","JEU"]}));
    if(GEL[1]) corps.push(box("Éducatif du geste : "+lineName(GEL[1]),"C",{L:[GEL[1]],f:famsOfLine(GEL[1]).filter(f=>f.startsWith("5.3")),dom:["GE"]}));
    corps.push(box("Jeu à thème","C",{L:GEL.length?GEL:[g],f:["5.5.1","5.5.2","5.5.5","5.5.8"],dom:["JEU"]}));
  } else if(T==="TC"){
    const g=GEL[0]||"GE4";
    corps.push(box("Exercice technique : "+lineName(g),"C",{L:[g],f:famsOfLine(g).filter(f=>f.startsWith("5.3")),dom:["GE"]}));
    corps.push(box("Situation tactique","C",{L:GEL,f:["5.5.5","5.5.1","5.5.2"],dom:["JEU"]}));
    corps.push(box("Jeu à thème, forme de match","C",{L:GEL,f:["5.5.6","5.5.4"],dom:["JEU"]}));
    corps.push(box("Physique et technique intégrés","C",{L:[...GEL,...DEL],f:["5.5.3"],dom:["JEU"]}));
    if(nC>=5) corps.push(box("Double","C",{f:["5.5.4"],dom:["JEU"]}));
  } else {
    corps.push(box("Routine et concentration","C",{f:["5.5.7","5.2.8"],kw:/routine|respir|concentr|attention|focal/}));
    corps.push(box("Situation mentale sur le court","C",{f:["5.5.7"]}));
    corps.push(box("Jeu sous pression","C",{f:["5.5.6","5.5.7"],kw:/pression|score|enjeu|decisif|tie/}));
    corps.push(box("Perception et décision","C",{f:["5.5.1","5.2.8"]}));
  }
  const C2=corps.slice(0,nC);
  // retour au calme
  const fT=D<=45?6:D<=75?8:10, fin=[box("Récupération active","F",{f:["5.2.5"],low:1}),box("Étirements et mobilité","F",{f:["5.1.24","5.1.21","5.1.22"],low:1})];
  if(c.zones.length || T==="PPI" || T==="PPC") fin.push(box("Prévention","F",{f:["5.2.2","5.2.3","5.2.4"],prev:1,low:1}));
  fin.forEach((b,i)=>b.min=Math.floor(fT/fin.length)+(i<fT%fin.length?1:0));
  const cT=Math.max(10,D-wT-fT); C2.forEach((b,i)=>b.min=Math.floor(cT/C2.length)+(i<cT%C2.length?1:0));
  return [...boxes,...C2,...fin];
}

/* ---------- dosage proposé ---------- */
function dose(e,c){
  const a=c.age, ph=c.phase, light=ph==="P"||ph==="C"||ph==="R"||ph==="R0", y=a<=10, m=a<=12;
  const D={
    force: y?"2 × 8 à 10, geste contrôlé, récup 1 min":m?"3 × 8 à 10, récup 1 min":a<=15?"3 à 4 × 6 à 8, récup 1 min 30":"4 × 4 à 6, récup 2 à 3 min",
    halte: a<=12?"3 × 5 au bâton, technique seule":a<=15?"4 × 3, charge légère, récup 2 min":"5 × 2 à 3, récup 2 à 3 min",
    gain: y?"3 × 15 à 20 s, récup 30 s":"3 × 30 à 45 s, récup 30 s",
    puis: y?"3 × 5, ludique, récup complète":a<=14?"3 × 5 à 6, récup 1 min 30":"4 × 4 à 6, récup complète 2 min",
    vit: y?"6 sprints de 5 à 10 m, retour en marchant":"6 à 8 sprints de 5 à 20 m, récup 1 min",
    cod: "6 à 8 passages de 5 à 8 s, récup 45 s à 1 min",
    aero: y?"10 à 15 min en jouant":m?"15 à 20 min continu ou 2 × 8 min":"20 à 30 min continu ou 3 × 8 min",
    rsa: y?"2 blocs de 3 à 4 min, récup 3 min":"2 à 3 blocs de 5 à 6 min, récup 3 min",
    coord: "4 à 6 passages, qualité avant vitesse",
    equi: "3 × 30 s par jambe",
    mob: "2 × 8 à 10 répétitions lentes",
    etd: "1 × 8 à 10 par côté",
    ets: "2 × 20 à 30 s par zone",
    ech: "2 à 4 min", prev:"2 × 10 à 12, lent", recup:"5 à 8 min", jeuph:"8 à 12 min", visu:"6 à 8 min", routine:"1 tour complet",
    tech: y?"3 blocs de 10 balles, récup 1 min":"3 à 4 blocs de 12 à 15 balles, récup 1 min",
    depl: "4 à 6 passages de 20 à 30 s, récup 40 s",
    jeu: "2 à 3 manches de 6 à 8 min", match:"1 set court ou 2 × 10 min"
  };
  let t=D[e.k]||"À régler";
  if(light && /force|halte|puis|aero|rsa|tech|jeu/.test(e.k)) t+=" · volume réduit d'un tiers";
  return t;
}

  $$("[data-mv]").forEach(b=>b.onclick=()=>{ const [bi,ei,d]=b.dataset.mv.split(":").map(Number); const A=s.boxes[bi].ex, j=ei+d; if(j<0||j>=A.length) return; [A[ei],A[j]]=[A[j],A[ei]]; upd(s); });

      <div class="exd"><input aria-label="Dosage" data-dose="${bi}:${ei}" value="${esc(x.d)}"><span class="pdose">${esc(x.d)}</span></div>
      <small>${e.L.map(chip).join("")} niv. ${e.v} · ${esc(e.ma.replace(/\.$/,""))}</small></div>
      <div class="exa noprint">${at?"":`<button type="button" class="ib sm" data-mv="${bi}:${ei}:-1" aria-label="Monter">↑</button><button type="button" class="ib sm" data-mv="${bi}:${ei}:1" aria-label="Descendre">↓</button>`}<button type="button" class="ib sm" data-rm="${bi}:${ei}" aria-label="Retirer">×</button></div></div>`; };
  return `<div class="box"><div class="boxh"><div><b>${esc(b.nom)}</b>${b.L?.length?" "+b.L.map(chip).join(""):""}</div>
    <label class="mn"><input type="number" min="0" max="120" data-min="${bi}" value="${b.min}" aria-label="Minutes"> min</label></div>
   ${at?`<p class="msg atx">Ateliers : <input type="number" class="nb noprint" min="2" max="8" data-atn="${bi}" value="${at.n}"><span class="pdose">${at.n}</span> ateliers · ${per} min chacun · groupes de ${grp} joueur${grp>1?"s":""} · rotation au signal</p>`:""}
   ${b.ex.map(exRow).join("")}
   <div class="boxf noprint">${at?"":`<button type="button" class="go sm" data-pick="${bi}">+ Choisir un exo</button>`}
    <span class="sp"></span><button type="button" class="lnk" data-bat="${bi}">${at?"Sans ateliers":"Ateliers"}</button><button type="button" class="lnk" data-bmv="${bi}:-1" aria-label="Monter la case">↑</button><button type="button" class="lnk" data-bmv="${bi}:1" aria-label="Descendre la case">↓</button><button type="button" class="lnk" data-bren="${bi}">Renommer</button><button type="button" class="lnk" data-bdel="${bi}">Supprimer</button></div></div>`;
}
function addBox(s,part){
  const opts=[["Ligne de grille",""],...[...Array(12)].map((_,i)=>["PP"+(i+1),lineName("PP"+(i+1))]),...[...Array(13)].map((_,i)=>["GE"+(i+1),lineName("GE"+(i+1))]),...[...Array(11)].map((_,i)=>["DE"+(i+1),lineName("DE"+(i+1))])];
  openSheet(`<div class="shh"><b>Ajouter une case · ${PARTS[part]}</b><button class="ib" data-close type="button">×</button></div>
   <p class="msg">Choisis une ligne de grille ou une famille de la banque.</p>
   <div class="f"><label for="al">Ligne de grille</label><select id="al"><option value="">—</option>${opts.slice(1).map(([k,n])=>`<option value="${k}">${k} · ${esc(n)}</option>`).join("")}</select></div>
   <div class="f"><label for="af">Ou famille d'exos</label><select id="af"><option value="">—</option>${DATA.fams.map(f=>`<option value="${f.c}">${esc(f.t)}</option>`).join("")}</select></div>
   <div class="f"><label for="an">Nom de la case</label><input id="an" placeholder="Laisse vide pour le nom automatique"></div>
   <div class="row"><div class="f"><label for="am">Minutes</label><input id="am" type="number" min="0" value="10"></div></div>
   <div class="tools"><button class="go" id="aok" type="button">Ajouter</button></div>`);
  $("#aok").onclick=()=>{ const l=$("#al").value, f=$("#af").value; if(!l&&!f) return;
    const b=box($("#an").value.trim()||(l?lineName(l):DATA.fams.find(x=>x.c===f).t.replace(/^.*?·\s*/,"")),part,{L:l?[l]:[],f:f?[f]:(l?famsOfLine(l):[]),min:+$("#am").value||10,prev:f&&/^5\.2\.[234]$/.test(f)?1:0,low:part!=="C"?1:0});
    let last=-1; s.boxes.forEach((x,i)=>{ if(x.part===part) last=i; }); if(last<0) last=part==="E"?-1:part==="C"?s.boxes.filter(x=>x.part==="E").length-1:s.boxes.length-1;
    s.boxes.splice(last+1,0,b); closeSheet(); upd(s); };
}

/* ---------- CHOIX D'UN EXO ---------- */
function picker(s,bi,slot){
  const B=s.boxes[bi], c=ctxOf(s), used=new Set(s.boxes.flatMap(b=>b.ex.filter(Boolean).map(x=>x.id)));
  const P=pool(B,c,used); const fams=[...new Set(P.map(x=>x.e.f))];
  let q="", ff="", lv="", shown=40;
  openSheet(`<div class="shh"><b>${esc(B.nom)}${slot!=null&&B.at?" · atelier "+(slot+1):""}</b><button class="ib" data-close type="button" aria-label="Fermer">×</button></div>
   <p class="msg">${P.length} exos possibles pour cette situation (âge ${c.age} ans, ${LIEUX[c.lieu].toLowerCase()}, ton matériel). Les plus adaptés sont en haut. Touche un exo pour l'ajouter ; ⓘ pour voir la fiche.</p>
   <input class="srch" id="pq" type="search" placeholder="Rechercher dans ces exos">
   <div class="row"><div class="f grow"><label for="pf">Famille</label><select id="pf"><option value="">Toutes</option>${fams.map(f=>`<option value="${f}">${esc(FAM[f]?.t||f)}</option>`).join("")}</select></div>
   <div class="f"><label for="pv">Niveau</label><select id="pv"><option value="">Tous</option>${[1,2,3,4].map(v=>`<option>${v}</option>`).join("")}</select></div></div>
   <div id="pl"></div>`);
  const draw=()=>{
    const qq=norm(q).split(/\s+/).filter(Boolean);
    const L=P.filter(({e})=>(!ff||e.f===ff)&&(!lv||e.v==lv)&&(!qq.length||qq.every(w=>norm(e.n+" "+e.s+" "+e.ob).includes(w))));
    const filt=q||ff||lv;
    const item=({e},i)=>`<div class="pit${used.has(e.id)?" used":""}"><button type="button" class="padd" data-add="${e.id}"><b>${esc(e.n)}</b><span>${esc(e.ob)}</span><small>${e.L.map(chip).join("")} niv. ${e.v} · dès ${e.a} ans · ${esc(e.ma.replace(/\.$/,""))}${used.has(e.id)?" · <em>déjà dans la séance</em>":""}</small></button><button type="button" class="ib sm" data-inf="${e.id}" aria-label="Voir la fiche">ⓘ</button></div>`;
    $("#pl").innerHTML = !L.length?`<div class="empty">Aucun exo. Vérifie le matériel, le lieu ou l'âge dans les réglages.</div>`:
      filt ? L.slice(0,shown).map(item).join("") :
      `<h3 class="alt">Les plus adaptés</h3>${L.slice(0,12).map(item).join("")}${L.length>12?`<h3 class="alt">Tous les autres possibles (${L.length-12})</h3>${L.slice(12,shown).map(item).join("")}`:""}`;
    if(L.length>shown) $("#pl").insertAdjacentHTML("beforeend",`<button type="button" class="ib" id="more">Voir plus (${L.length-shown} restants)</button>`);
    $("#more") && ($("#more").onclick=()=>{ shown+=60; draw(); });
    $$("[data-add]",sheet).forEach(b=>b.onclick=()=>{ const e=EX[b.dataset.add], x={id:e.id,d:dose(e,c)}; if(B.at){ const k=slot!=null?slot:B.ex.findIndex(z=>!z); if(k>=0) B.ex[k]=x; else B.ex.push(x); } else B.ex.push(x); closeSheet(); upd(s); });
    $$("[data-inf]",sheet).forEach(b=>b.onclick=()=>fiche(b.dataset.inf,()=>picker(s,bi,slot)));
  };
  $("#pq").oninput=e=>{ q=e.target.value; shown=40; draw(); };
  $("#pf").onchange=e=>{ ff=e.target.value; shown=40; draw(); };
  $("#pv").onchange=e=>{ lv=e.target.value; shown=40; draw(); };
  draw();
}

/* ---------- FICHE D'UN EXO (+ vidéo de la banque si présente) ---------- */
let VIDL=null;
async function videoOf(id){
  try{ const db=await new Promise((ok,ko)=>{ const r=indexedDB.open("banque_videos",1); r.onupgradeneeded=()=>r.result.createObjectStore("v"); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(); });
    const blob=await new Promise(ok=>{ const t=db.transaction("v").objectStore("v").get(id); t.onsuccess=()=>ok(t.result); t.onerror=()=>ok(null); }); if(blob) return {u:URL.createObjectURL(blob)}; }catch(e){}
  try{ if(!VIDL) VIDL=await (await fetch("../Banque-/videos.json",{cache:"no-store"})).json(); if(VIDL?.[id]) return {l:VIDL[id]}; }catch(e){ VIDL={}; }
  return null;
}
function fiche(id,back){
  const e=EX[id]; if(!e) return;
  openSheet(`<div class="shh"><b>${esc(e.n)}</b><button class="ib" data-close type="button" aria-label="Fermer">×</button></div>
   <p class="msg">${esc(e.id)} · ${esc(FAM[e.f]?.t||"")} · ${esc(e.s)}</p><p>${e.L.map(chip).join(" ")} niveau ${e.v} · ${esc(e.an)}</p><div id="vid"></div>
   <div class="fx"><p><b>Objectif.</b> ${esc(e.ob)}</p><p><b>Matériel.</b> ${esc(e.ma)}</p><p><b>Déroulement.</b> ${esc(e.de)}</p><p><b>Consignes.</b> ${esc(e.co)}</p><p><b>Erreurs à corriger.</b> ${esc(e.er)}</p><p><b>Utilisation.</b> ${esc(e.ut)}</p></div>
   ${back?`<div class="tools"><button class="ib" id="fbk" type="button">‹ Retour à la liste</button></div>`:""}`);
  back && ($("#fbk").onclick=back);
  videoOf(id).then(v=>{ const el=$("#vid"); if(!el||!v) return; el.innerHTML=v.u?`<video src="${v.u}" controls playsinline style="width:100%;border-radius:10px"></video>`:`<p><a class="ib" href="${esc(v.l)}" target="_blank" rel="noopener">Voir la vidéo</a></p>`; });
}

/* ---------- PDF DE LA SÉANCE ---------- */
async function pdfSeance(s){
  const b=$("#prt"); b.textContent="Préparation…";
  try{
  const c=ctxOf(s), J=joueurs().filter(j=>s.joueurs.includes(j.id)), d=new MiniPDF.Doc(), M=d.M, W=d.W-2*M;
  const COL={E:"#0F766E",C:"#1D4ED8",F:"#7C3AED"};
  d.para(s.nom||"Séance",{size:18,bold:true,after:4});
  d.para(`${TYPES[s.type].n} · ${frD(s.date)} · ${PHASES[s.phase]} · ${s.duree} min · ${LIEUX[s.lieu]}`,{size:10,color:"#5D6675"});
  d.para(J.length?"Joueurs : "+J.map(j=>j.nom).join(", ")+(s.libre.extra?" + "+s.libre.extra:""):`${c.n} joueur${c.n>1?"s":""} · ${c.age} ans`,{size:10,color:"#5D6675"});
  if(s.theme) d.para("Thème : "+s.theme,{size:11,bold:true,after:2});
  if(s.lignes.length) d.para("Lignes : "+s.lignes.map(l=>l+" "+lineName(l)).join(" · "),{size:9,color:"#5D6675"});
  if(c.zones.length||c.crois) d.para("Vigilance : "+[...c.zones.map(z=>ZN[z]),...(c.crois?["croissance"]:[])].join(", "),{size:9,color:"#B91C1C"});
  d.y+=6;
  for(const p of ["E","C","F"]){
    const bx=s.boxes.filter(b=>b.part===p); if(!bx.length) continue;
    d.need(40); d.rect(M,d.y,W,20,{fill:COL[p]}); d.text(M+8,d.y+5,PARTS[p],{size:12,bold:true,color:"#FFFFFF"});
    const mt=bx.reduce((a,b)=>a+(+b.min||0),0)+" min"; d.text(M+W-8-MiniPDF.width(mt,11,true),d.y+5,mt,{size:11,bold:true,color:"#FFFFFF"}); d.y+=26;
    for(const B of bx){
      d.need(34); const mn=(B.min||0)+" min";
      d.text(M,d.y,B.nom,{size:11.5,bold:true}); d.text(M+W-MiniPDF.width(mn,10.5,true),d.y,mn,{size:10.5,bold:true,color:COL[p]}); d.y+=16;
      if(B.at) d.para(`${B.at.n} ateliers · ${Math.round((B.min||0)/B.at.n)} min chacun · groupes de ${Math.ceil(c.n/B.at.n)} · rotation au signal`,{size:9,color:"#5D6675",x:M+10});
      const L=B.ex.map((x,i)=>[x,i]).filter(([x])=>x&&EX[x.id]);
      if(!L.length){ d.para("(aucun exo choisi)",{size:9,color:"#8A94A3",x:M+10}); }
      for(const [x,i] of L){ const e=EX[x.id];
        d.need(30); d.para((B.at?`Atelier ${i+1} · `:"")+e.n,{size:10.5,bold:true,x:M+10,after:0});
        if(x.d) d.para(x.d,{size:9.5,color:COL[p],x:M+10,after:0});
        if(e.co) d.para("Consignes : "+e.co,{size:9,color:"#333333",x:M+10,after:0});
        if(e.ma) d.para("Matériel : "+e.ma,{size:8.5,color:"#5D6675",x:M+10,after:5});
      }
      d.line(M,d.y,M+W,d.y); d.y+=8;
    }
    d.y+=4;
  }
  const r=await MiniPDF.deliver(d.out(),`Séance ${(s.nom||"").replace(/[\\/:*?"<>|]/g,"").slice(0,40)} ${frD(s.date).replace(/\//g,"-")}.pdf`);
  b.textContent= r==="download"?"PDF téléchargé":"Imprimer / PDF";
  }catch(e){ b.textContent="Erreur PDF"; console.error(e); }
  setTimeout(()=>{ const x=$("#prt"); if(x) x.textContent="Imprimer / PDF"; },2500);
}

/* ---------- MODE TERRAIN ---------- */
let TIMER=null;
function showTerrain(id,k){
  const s=getS(id); if(!s?.boxes){ go("#"); return; }
  const list=s.boxes; k=Math.max(0,Math.min(list.length-1,+k||0)); const b=list[k];
  clearInterval(TIMER); let left=(+b.min||0)*60, run=false;
  main.innerHTML=`<div class="ter"><div class="terh"><a class="ib" href="#s/${s.id}">Quitter</a><span>${PARTS[b.part]} · ${k+1}/${list.length}</span></div>
   <h1>${esc(b.nom)}</h1><div class="clock" id="clk"></div>
   <div class="tools"><button class="go big" id="st" type="button">Démarrer</button><button class="ib" id="rz" type="button">Remettre à ${b.min} min</button></div>
   ${b.at?`<p class="msg">${b.at.n} ateliers · ${Math.round(b.min/b.at.n)} min chacun · rotation au signal</p>`:""}
   ${b.ex.filter(Boolean).length?b.ex.map((x,i)=>{ const e=x&&EX[x.id]; return e?`<div class="terx">${b.at?`<b>Atelier ${i+1}</b>`:""}<h3>${esc(e.n)}</h3><p class="dz">${esc(x.d)}</p><p><b>Consignes.</b> ${esc(e.co)}</p><p class="msg"><b>Déroulement.</b> ${esc(e.de)}</p><button type="button" class="lnk" data-fiche="${e.id}">Fiche complète</button></div>`:""; }).join(""):`<div class="empty">Aucun exo choisi dans cette case.</div>`}
   <div class="pn"><a href="#t/${s.id}/${k-1}" ${k?"":"hidden"}><small>Précédent</small>${esc(list[k-1]?.nom||"")}</a><a class="nx" href="#t/${s.id}/${k+1}" ${k<list.length-1?"":"hidden"}><small>Suivant</small>${esc(list[k+1]?.nom||"")}</a></div></div>`;
  const show=()=>{ const m=Math.floor(Math.abs(left)/60), x=Math.abs(left)%60; $("#clk").textContent=(left<0?"+":"")+m+":"+String(x).padStart(2,"0"); $("#clk").classList.toggle("over",left<0); };
  show();
  $("#st").onclick=()=>{ run=!run; $("#st").textContent=run?"Pause":"Reprendre"; clearInterval(TIMER); if(run) TIMER=setInterval(()=>{ left--; show(); if(left===0 && navigator.vibrate) navigator.vibrate(400); },1000); };
  $("#rz").onclick=()=>{ left=(+b.min||0)*60; show(); };
  $$("[data-fiche]").forEach(x=>x.onclick=()=>fiche(x.dataset.fiche));
}

/* ---------- ROUTAGE ---------- */
function route(){
  clearInterval(TIMER); closeSheet();
  const [a,b,c]=location.hash.slice(1).split("/").map(decodeURIComponent);
  document.body.classList.toggle("terrain",a==="t");
  if(a==="r"&&b) showReglages(b); else if(a==="s"&&b) showSeance(b); else if(a==="pl"&&b) showPlanList(b); else if(a==="p"&&b) fromPlan(b,c); else if(a==="t"&&b) showTerrain(b,c); else showHome();
  if(a!=="s") scrollTo(0,0);
  $("#back").style.visibility=a?"visible":"hidden";
}
addEventListener("hashchange",route);
async function boot(){
  try{ const r = await fetch("data.json"); const d = await r.json(); DATA=d;
    for(const e of DATA.ex) EX[e.id]=e; for(const f of DATA.fams) FAM[f.c]=f; route(); }
  catch(e){ main.innerHTML=`<div class="empty">Impossible de charger les exos. Ouvre l'appli une fois avec une connexion.</div>`; }
}
boot();
